<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Race Plan</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1 id="routeName">Race Plan</h1>
      <div id="summary" class="summary"></div>
      <div class="live">
        <span id="liveWind" class="live-item"><span class="dot"></span>Wind <span class="age">--</span></span>
        <span id="liveGps" class="live-item"><span class="dot"></span>GPS <span class="age">--</span></span>
        <span id="livePolar" class="live-item"><span class="dot"></span>Polar <span class="age">--</span></span>
      </div>
      <div id="status" class="muted"></div>
      <div id="conn" class="warn">Connecting…</div>
      <div id="polarStatus" class="warn" hidden></div>
    </div>
    <div class="wind">
      <div class="wind-group">
        <div id="twdLiveTile" class="wind-tile">
          <div class="wind-label">TWD Signal K <span class="in-use-tag">In use</span></div>
          <div id="twdLive" class="wind-value">--</div>
          <div id="twdVia" class="wind-via"></div>
        </div>
        <div id="twdOverrideTile" class="wind-tile override">
          <label class="wind-label" for="twdOverride">TWD override <span class="in-use-tag">In use</span></label>
          <div class="wind-value">
            <input id="twdOverride" type="number" min="0" max="359" step="1" placeholder="off">
            <button id="twdClear" type="button" aria-label="Clear TWD override">&times;</button>
          </div>
        </div>
      </div>
      <div class="wind-group">
        <div id="twsLiveTile" class="wind-tile">
          <div class="wind-label">TWS Signal K <span class="in-use-tag">In use</span></div>
          <div id="twsLive" class="wind-value">--</div>
        </div>
        <div id="twsOverrideTile" class="wind-tile override">
          <label class="wind-label" for="twsOverride">TWS override (kn) <span class="in-use-tag">In use</span></label>
          <div class="wind-value">
            <input id="twsOverride" type="number" min="0" step="0.5" placeholder="off">
            <button id="twsClear" type="button" aria-label="Clear TWS override">&times;</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th class="leg">Leg</th>
          <th class="num">TWA<div id="twaSource" class="sub"></div></th>
          <th class="num">STW<div id="stwSource" class="sub"></div></th>
          <th class="num">Time</th>
          <th class="num">Port / Stbd</th>
          <th class="num">ETA</th>
          <th class="num">BRG<div id="brgSource" class="sub"></div></th>
          <th class="num">DIST</th>
        </tr>
      </thead>
      <tbody id="legs">
        <tr><td colspan="8" class="muted center">No active route</td></tr>
      </tbody>
    </table>
  </main>

  <script src="app.js"></script>
</body>
</html>
